[pytest]
testpaths = tests
# Fail on any warning, with narrow, justified ignores for noise that
# originates outside this codebase (verified: none are raised by
# project code):
# - starlette's UserWarning subclass emitted at testclient import time
# - anyio BlockingPortal alias deprecation inside starlette.testclient
# - joblib/loky physical-core probe failure on Windows (wmic absent)
filterwarnings =
    error
    ignore:Using `httpx` with `starlette.testclient`:UserWarning
    ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning
    ignore:Could not find the number of physical cores:UserWarning
